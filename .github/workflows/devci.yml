name: CareAutomate Backend App CI

on:
  push:
    branches: ['dev']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          no-cache: true
          tags: arshadak2025/appbackend:latest
          build-args: |
            PORT=${{ secrets.DEV_PORT }}
            DB_URL=${{ secrets.DB_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            HASH_KEY=${{ secrets.HASH_KEY }}
            CLIENT_URL=${{ secrets.DEV_CLIENT_URL }}
            BUCKET_NAME=${{ secrets.BUCKET_NAME }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            NODE_ENV=${{ secrets.NODE_ENV }}
            GMAIL_USER=${{ secrets.GMAIL_USER }}
            GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_BUCKET_NAME=${{ secrets.AWS_BUCKET_NAME }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
            TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
            TWILIO_API_KEY=${{ secrets.TWILIO_API_KEY }}
            TWILIO_API_SECRET=${{ secrets.TWILIO_API_SECRET }}
            TWILIO_CONVERSATIONS_SERVICE_SID=${{ secrets.TWILIO_CONVERSATIONS_SERVICE_SID }}
            TWILIO_SYNC_SERVICE_SID=${{ secrets.TWILIO_SYNC_SERVICE_SID }}
            SFTP_USERNAME=${{ secrets.SFTP_USERNAME }}
            SFTP_PASSWORD=${{ secrets.SFTP_PASSWORD }}
          secrets: |
            PORT=${{ secrets.DEV_PORT }}
            DB_URL=${{ secrets.DB_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            HASH_KEY=${{ secrets.HASH_KEY }}
            CLIENT_URL=${{ secrets.DEV_CLIENT_URL }}
            BUCKET_NAME=${{ secrets.BUCKET_NAME }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            NODE_ENV=${{ secrets.NODE_ENV }}
            GMAIL_USER=${{ secrets.GMAIL_USER }}
            GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_BUCKET_NAME=${{ secrets.AWS_BUCKET_NAME }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
            TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
            TWILIO_API_KEY=${{ secrets.TWILIO_API_KEY }}
            TWILIO_API_SECRET=${{ secrets.TWILIO_API_SECRET }}
            TWILIO_CONVERSATIONS_SERVICE_SID=${{ secrets.TWILIO_CONVERSATIONS_SERVICE_SID }}
            TWILIO_SYNC_SERVICE_SID=${{ secrets.TWILIO_SYNC_SERVICE_SID }}
            SFTP_USERNAME=${{ secrets.SFTP_USERNAME }}
            SFTP_PASSWORD=${{ secrets.SFTP_PASSWORD }}
